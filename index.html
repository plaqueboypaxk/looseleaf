  function bpmLabel(t){ return (t.bpmGuess ? '~' : '') + (t.bpm || '—') + (t.bpmGuess && t.bpmLow ? '?' : ''); }
  function showMeta(t){
    const b = parseFloat(t.bpm);
    metaBpm.textContent = bpmLabel(t) + (tempoRate !== 1 && isFinite(b) ? ` → ${(b*tempoRate).toFixed(1)}` : '');
    let k = keyLabel(t);
    const st = ksSemi + (tempoRate !== 1 && !keyLock ? Math.round(12*Math.log2(tempoRate)) : 0);   // key shift + (with key lock off) speed-driven shift
    if(st !== 0){
      const p = normKey(t.key);
      if(p){ const q = { pc: (p.pc + st + 120) % 12, minor: p.minor }; k = `≈ ${PITCHES[q.pc]}${q.minor ? 'm' : ''} · ${camNum(q)}${q.minor ? 'A' : 'B'}`; }
    }
    metaKey.textContent = k;
  }

  function fillRow(t, i){
    const r = t._row; if(!r) return;
    r.children[0].textContent = String(i+1).padStart(2,'0');
    r.children[1].textContent = t.title + (t.artist ? ' — ' + t.artist : '');
    r.children[2].textContent = keyLabel(t);
    r.children[3].textContent = bpmLabel(t);
  }

  function renderList(){
    listEl.innerHTML = '';
    listEl.dataset.mode = sortMode;
    LIBRARY.forEach((t, i)=>{
      const row = document.createElement('button');
      row.className = 'trow';
      row.innerHTML = '<span class="tn"></span><span class="tt"></span><span class="tk"></span><span class="tb"></span><span class="tc"><i class="gr" title="Drag to reorder">≡</i><i class="up">▲</i><i class="dn">▼</i><i class="rm">×</i></span>';
      row.addEventListener('pointerdown', (e)=>{ if(e.target.closest('.gr')) startRowDrag(t, e); });
      row.addEventListener('click', (e)=>{
        if(justDragged) return;
        const act = e.target.closest('.tc i'); if(act){ if(act.classList.contains('gr')) return; rowAction(t, act.className); return; }
        if(LIBRARY[currentIndex] === t){ playBtn.click(); return; }   // tapping the current song toggles play/pause
        const from = currentIndex;
        wasPlayingBeforeSwitch = true;
        currentIndex = LIBRARY.indexOf(t);
        transitionCard(currentIndex > from ? 'right' : 'left');
      });
      t._row = row;
      listEl.appendChild(row);
      fillRow(t, i);
    });
    updateListActive();
  }

  // Harmonic + tempo match: same/adjacent Camelot key (or relative major/minor) within 6% BPM.
  function compatible(cp, cb, t){
    const p = normKey(t.key), b = parseFloat(t.bpm);
    if(!cp || !p || !isFinite(cb) || !isFinite(b)) return false;
    const d = Math.abs(camNum(cp) - camNum(p)), near = Math.min(d, 12-d);
    const keyOk = cp.minor === p.minor ? near <= 1 : near === 0;
    return keyOk && Math.abs(b - cb) / cb <= 0.06;
  }

  function updateListActive(){
    const cur = LIBRARY[currentIndex];
    const cp = cur ? normKey(cur.key) : null, cb = cur ? parseFloat(cur.bpm) * tempoRate : NaN;   // match against the tempo you're actually hearing
    LIBRARY.forEach(t=>{
      if(!t._row) return;
      t._row.classList.toggle('active', t === cur);
      const m = !!cur && t !== cur && compatible(cp, cb, t);
      t._row.classList.toggle('match', m);
      const kp = normKey(t.key);
      const keyHide = !!keyFilter && t !== cur && !(kp && camNum(kp) === keyFilter.num && kp.minor === keyFilter.minor);
      t._row.hidden = (matchOnly && t !== cur && !m) || keyHide;
    });
    if(cur && cur._row) cur._row.scrollIntoView({ block:'nearest' });
  }

  function render(){
    if(currentIndex < 0 || !LIBRARY.length) return;
    const track = LIBRARY[currentIndex];
    trackIndexEl.textContent = `[ ${String(currentIndex+1).padStart(2,'0')} / ${String(LIBRARY.length).padStart(2,'0')} ]`;
    titleEl.textContent = track.title;
    playedKeys.add(track._fk);
    if(lastShown && lastShown !== track && !goingBack){ playHistory.push(lastShown); if(playHistory.length > 200) playHistory.shift(); }
    goingBack = false; lastShown = track; shuffleSeen.add(track);
    const bigLetterEl = document.getElementById('bigLetter');
    bigLetterEl.textContent = track.letter || '';
    [titleEl, artistEl, bigLetterEl].forEach(el=>{ el.classList.remove('slam'); void el.offsetWidth; el.classList.add('slam'); });
    artistEl.textContent = track.artist || '';
    showMeta(track);
    renderArt(track);
    resizeWaveCanvas();

    prevBtn.disabled = LIBRARY.length < 2;
    nextBtn.disabled = LIBRARY.length < 2;

    loadTrackIntoAudio(track);
    applyTempo();
    updateLetterRail();
    document.title = `${track.title}${track.artist ? ' — ' + track.artist : ''}`;
    updateMediaSession(track);
  }

  function loadTrackIntoAudio(track){
    const shouldAutoplay = wasPlayingBeforeSwitch;
    audioEl.pause();
    audioEl.src = track.url;
    audioEl.load();
    curTimeEl.textContent = '0:00';
    durTimeEl.textContent = track.duration ? formatTime(track.duration) : '0:00';
    loopOn = false; djSync();
    drawWave(track.peaks, 0);

    if(!track.peaks){
      decodingNote.classList.add('active');
      analyzeTrack(track).then(()=>decodingNote.classList.remove('active'));
    }

    if(shouldAutoplay){
      audioEl.play().catch(()=>{ setPlayIcon(false); });
    } else {
      setPlayIcon(false);
    }
  }

  function setPlayIcon(isPlaying){
    document.body.classList.toggle('playing', isPlaying);
    playIcon.innerHTML = isPlaying
      ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
  }

  /* ---------- audio element events drive the real UI state ---------- */
  audioEl.addEventListener('play', ()=>{ setPlayIcon(true); wasPlayingBeforeSwitch = true; });
  audioEl.addEventListener('pause', ()=>{ setPlayIcon(false); wasPlayingBeforeSwitch = false; if(xf) xfCancel(); });   // skipping or pausing mid-fade cancels it
  audioEl.addEventListener('timeupdate', ()=>{
    if(currentIndex < 0) return;
    const track = LIBRARY[currentIndex];
    const dur = audioEl.duration || track.duration || 0;
    curTimeEl.textContent = formatTime(audioEl.currentTime);
    if(dur) durTimeEl.textContent = formatTime(dur);
    if(track.peaks) drawWave(track.peaks, dur ? audioEl.currentTime/dur : 0);
  });
  audioEl.addEventListener('loadedmetadata', ()=>{
    if(currentIndex < 0) return;
    const track = LIBRARY[currentIndex];
    if(!track.duration || track.duration === Infinity) track.duration = audioEl.duration;
    durTimeEl.textContent = formatTime(audioEl.duration);
  });
  audioEl.addEventListener('ended', ()=>{
    if(xf){ xfFinish(); return; }
    if(repeatMode === 'one'){ audioEl.currentTime = 0; audioEl.play().catch(()=>{}); return; }
    const i = nextIndex(true);
    if(i < 0){ wasPlayingBeforeSwitch = false; setPlayIcon(false); syncPlaybackState(); return; }   // end of the list, repeat is off
    wasPlayingBeforeSwitch = true;
    jumpTo(i);          // no card animation here: phones only let the next song start straight away, not after a timer
  });

  /* ---------- shuffle, repeat, volume ---------- */
  const shuffleBtn = document.getElementById('shuffle'), repeatBtn = document.getElementById('repeat');
  const REPEAT_ORDER = ['off', 'all', 'one'];
  const REPEAT_SVG = '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>';
  let shuffleOn = false, repeatMode = 'off';
  const playHistory = [], shuffleSeen = new Set();   // history powers "previous" while shuffling
  let lastShown = null, goingBack = false;
  const store = (k, v) => { try{ localStorage.setItem('looseleaf.' + k, v); }catch(e){} };
  const recall = k => { try{ return localStorage.getItem('looseleaf.' + k); }catch(e){ return null; } };

  // Which song plays next. `auto` = the song just ended by itself (returns -1 to stop at the end of the list).
  function nextIndex(auto){
    const n = LIBRARY.length; if(!n) return -1;
    const cur = LIBRARY[currentIndex];
    if(shuffleOn && n > 1){
      let pool = LIBRARY.filter(t => t !== cur && !shuffleSeen.has(t));      // every song plays once before any repeats
      if(!pool.length){
        if(auto && repeatMode !== 'all') return -1;
        shuffleSeen.clear(); if(cur) shuffleSeen.add(cur);
        pool = LIBRARY.filter(t => t !== cur);
      }
      return LIBRARY.indexOf(pool[Math.floor(Math.random() * pool.length)]);
    }
    if(currentIndex + 1 < n) return currentIndex + 1;
    return (auto && repeatMode !== 'all') ? -1 : 0;
  }
  function prevIndex(){
    if(shuffleOn){
      while(playHistory.length){
        const i = LIBRARY.indexOf(playHistory.pop());
        if(i >= 0 && i !== currentIndex){ goingBack = true; return i; }
      }
    }
    const n = LIBRARY.length; return (currentIndex - 1 + n) % n;
  }
  function jumpTo(i){ currentIndex = i; render(); }   // switch song right now, no animation

  function setShuffle(on, save){
    shuffleOn = !!on;
    shuffleBtn.classList.toggle('on', shuffleOn);
    shuffleBtn.setAttribute('aria-pressed', String(shuffleOn));
    shuffleBtn.setAttribute('aria-label', 'Shuffle: ' + (shuffleOn ? 'on' : 'off'));
    shuffleBtn.title = 'Shuffle: ' + (shuffleOn ? 'on' : 'off') + ' (s)';
    if(shuffleOn){ shuffleSeen.clear(); const c = LIBRARY[currentIndex]; if(c) shuffleSeen.add(c); }
    if(save !== false) store('shuffle', shuffleOn ? '1' : '0');
  }
  function setRepeat(mode, save){
    repeatMode = REPEAT_ORDER.includes(mode) ? mode : 'off';
    repeatBtn.classList.toggle('on', repeatMode !== 'off');
    repeatBtn.querySelector('svg').innerHTML = REPEAT_SVG + (repeatMode === 'one' ? '<path d="M11 10h1v4"/>' : '');
    repeatBtn.setAttribute('aria-label', 'Repeat: ' + repeatMode);
    repeatBtn.title = 'Repeat: ' + repeatMode + ' (r)';
    if(save !== false) store('repeat', repeatMode);
  }
  shuffleBtn.addEventListener('click', ()=>setShuffle(!shuffleOn));
  repeatBtn.addEventListener('click', ()=>setRepeat(REPEAT_ORDER[(REPEAT_ORDER.indexOf(repeatMode) + 1) % 3]));

  // Advanced (DJ) controls — tempo, cues, loop, key shift, auto-mix, volume —
  // stay tucked away by default so the everyday player isn't a wall of rows.
  // Remembers whether you left it open, same as shuffle/repeat/volume.
  const advancedToggle = document.getElementById('advancedToggle');
  const advancedPanel = document.getElementById('advancedPanel');
  function setAdvanced(on, save){
    const isOn = !!on;
    advancedPanel.classList.toggle('hidden', !isOn);
    advancedToggle.setAttribute('aria-expanded', String(isOn));
    if(save !== false) store('advanced', isOn ? '1' : '0');
  }
  advancedToggle.addEventListener('click', ()=>setAdvanced(advancedToggle.getAttribute('aria-expanded') !== 'true'));

  // Volume. The slider is what you feel; the audio level follows a curve so the low end isn't all crammed at the top.
  // iPhones and iPads ignore page volume (hardware buttons only), so the slider hides itself there.
  const volEl = document.getElementById('vol'), volVal = document.getElementById('volVal'), muteBtn = document.getElementById('muteBtn'), volRow = document.getElementById('volRow');
  let volLevel = 1, lastVol = 1;
  const volWorks = (()=>{ try{ const old = audioEl.volume; audioEl.volume = 0.5; const ok = Math.abs(audioEl.volume - 0.5) < 0.01; audioEl.volume = old; return ok; }catch(e){ return false; } })();
  if(!volWorks) volRow.classList.add('hidden');
  function setVolume(v, save){
    volLevel = Math.min(1, Math.max(0, v));
    audioEl.volume = volLevel * volLevel;
    volEl.value = volLevel; volVal.textContent = Math.round(volLevel * 100) + '%';
    muteBtn.classList.toggle('on', volLevel === 0);
    muteBtn.setAttribute('aria-label', volLevel === 0 ? 'Unmute' : 'Mute');
    if(save !== false) store('vol', String(volLevel));
  }
  volEl.addEventListener('input', ()=>{ const v = parseFloat(volEl.value); if(v > 0) lastVol = v; setVolume(v); });
  muteBtn.addEventListener('click', ()=>{ if(!volWorks) return; if(volLevel > 0){ lastVol = volLevel; setVolume(0); } else setVolume(lastVol || 1); });

  /* ---------- lock screen, headphones and media keys ---------- */
  const hasMS = 'mediaSession' in navigator;
  function updateMediaSession(track){
    if(!hasMS || !window.MediaMetadata) return;
    try{
      const art = [];
      if(track.artUrl) art.push({ src: track.artUrl, sizes: '512x512' });
      else { try{ art.push({ src: artCanvas.toDataURL('image/png'), sizes: artCanvas.width + 'x' + artCanvas.height, type: 'image/png' }); }catch(e){} }
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.title || 'untitled', artist: track.artist || 'looseleaf',
        album: currentVault ? currentVault.name : 'looseleaf', artwork: art
      });
    } catch(e){}
    syncPlaybackState();
  }
  function syncPlaybackState(){
    if(!hasMS) return;
    try{ navigator.mediaSession.playbackState = LIBRARY.length ? (audioEl.paused ? 'paused' : 'playing') : 'none'; }catch(e){}
  }
  let lastPosSent = 0;
  function syncPosition(force){
    if(!hasMS || !navigator.mediaSession.setPositionState) return;
    const now = Date.now(); if(!force && now - lastPosSent < 1000) return; lastPosSent = now;
    const d = audioEl.duration;
    if(!isFinite(d) || d <= 0) return;
    try{ navigator.mediaSession.setPositionState({ duration: d, playbackRate: audioEl.playbackRate || 1, position: Math.min(audioEl.currentTime, d) }); }catch(e){}
  }
  if(hasMS){
    const on = (a, fn) => { try{ navigator.mediaSession.setActionHandler(a, fn); }catch(e){} };
    on('play', ()=>{ audioEl.play().catch(()=>{}); });
    on('pause', ()=>{ audioEl.pause(); });
    on('previoustrack', ()=>{
      if(!LIBRARY.length) return;
      if(audioEl.currentTime > 3){ audioEl.currentTime = 0; return; }
      jumpTo(prevIndex());
    });
    on('nexttrack', ()=>{ const i = nextIndex(false); if(i >= 0) jumpTo(i); });
    on('seekto', d=>{
      if(d.fastSeek && 'fastSeek' in audioEl) audioEl.fastSeek(d.seekTime); else audioEl.currentTime = d.seekTime;
      syncPosition(true);
    });
    ['play', 'pause', 'seeked', 'ratechange', 'loadedmetadata', 'durationchange'].forEach(ev => audioEl.addEventListener(ev, ()=>{ syncPlaybackState(); syncPosition(true); }));
    audioEl.addEventListener('timeupdate', ()=>syncPosition(false));
  }

  /* ---------- navigation ---------- */
  function goTo(newIndex, dir){
    if(!LIBRARY.length) return;
    const n = LIBRARY.length;
    newIndex = ((newIndex % n) + n) % n;
    currentIndex = newIndex;
    transitionCard(dir);
  }

  function goToLetter(direction){
    if(!LIBRARY.length || letters.length < 2) return;
    const currentLetter = LIBRARY[currentIndex].letter;
    let li = letters.indexOf(currentLetter);
    li = ((li + direction) % letters.length + letters.length) % letters.length;
    const targetLetter = letters[li];
    const idx = LIBRARY.findIndex(t=>t.letter === targetLetter);
    currentIndex = idx;
    transitionCard(direction < 0 ? 'up' : 'down');
  }

  function transitionCard(dir){
    card.classList.add('leaving-'+dir);
    setTimeout(()=>{
      render();
      card.classList.remove('leaving-'+dir);
    }, 160);
  }

  /* ---------- controls ---------- */
  prevBtn.addEventListener('click', ()=>{
    if(audioEl.currentTime > 3){ audioEl.currentTime = 0; return; }   // standard: restart first, then go back
    if(LIBRARY.length) goTo(prevIndex(), 'left');
  });
  nextBtn.addEventListener('click', ()=>{ const i = nextIndex(false); if(i >= 0) goTo(i, 'right'); });
  playBtn.addEventListener('click', ()=>{
    if(audioEl.paused) audioEl.play().catch(()=>{});
    else audioEl.pause();
  });
  waveCanvas.addEventListener('click', (e)=>{
    if(currentIndex < 0) return;
    const track = LIBRARY[currentIndex];
    const dur = audioEl.duration || track.duration;
    if(!dur) return;
    const rect = waveCanvas.getBoundingClientRect();
    const ratio = Math.min(0.999, Math.max(0,(e.clientX-rect.left)/rect.width));
    audioEl.currentTime = ratio * dur;
  });

  /* keyboard */
  window.addEventListener('keydown', (e)=>{
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    const typing = e.target.tagName === 'INPUT' && e.target.type !== 'range';   // chip or rename box
    if(typing) return;
    if(e.key === 's' || e.key === 'S') setShuffle(!shuffleOn);
    if(e.key === 'r' || e.key === 'R') setRepeat(REPEAT_ORDER[(REPEAT_ORDER.indexOf(repeatMode) + 1) % 3]);
    if(e.key === 'm' || e.key === 'M') muteBtn.click();
    if(/^[1-4]$/.test(e.key)) cuePad(+e.key - 1);
    if(e.key === 'l' || e.key === 'L') loopBtnEl.click();
    if(e.target.tagName === 'INPUT') return;   // a focused slider keeps its own arrow keys
    if(['ArrowRight','ArrowLeft','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
    if(e.key === 'ArrowRight') goTo(currentIndex+1,'right');
    if(e.key === 'ArrowLeft') goTo(currentIndex-1,'left');
    if(e.key === 'ArrowUp') goToLetter(-1);
    if(e.key === 'ArrowDown') goToLetter(1);
    if(e.key === ' '){ if(audioEl.paused) audioEl.play().catch(()=>{}); else audioEl.pause(); }
  });

  /* ---------- navigation helpers (no animation — used by both button/keyboard and drag paths) ---------- */
  function letterTargetIndex(direction){
    if(!LIBRARY.length || letters.length < 2) return currentIndex;
    const currentLetter = LIBRARY[currentIndex].letter;
    let li = letters.indexOf(currentLetter);
    li = ((li + direction) % letters.length + letters.length) % letters.length;
    const targetLetter = letters[li];
    return LIBRARY.findIndex(t=>t.letter === targetLetter);
  }

  /* ---------- swipe: live drag-follow ---------- */
  const DRAG_DEADZONE = 6;      // px of movement before we lock an axis
  const COMMIT_DISTANCE = 70;   // px dragged to commit a navigation
  const COMMIT_VELOCITY = 0.55; // px/ms — a fast flick commits even under the distance threshold
  const EXIT_X = 260;
  const EXIT_Y = 170;

  let dragging = false;
  let dragAxis = null;      // 'x' | 'y' | null
  let startX=0, startY=0, dx=0, dy=0;
  let lastMoveX=0, lastMoveY=0, lastMoveT=0, velocity=0;

  function applyDragTransform(){
    const tx = dragAxis === 'x' ? dx : 0;
    const ty = dragAxis === 'y' ? dy : 0;
    card.style.transform = `translate(${tx}px, ${ty}px)`;
  }

  function resetCardStyle(animated){
    card.style.transition = animated ? 'transform .16s linear' : 'none';
    card.style.transform = 'translate(0,0)';
    card.style.opacity = '1';
    if(animated) scheduleClearInlineStyle(200);
  }

  // Inline styles (transform/opacity/transition) drive the live drag, but once a
  // gesture has settled we hand control back to the stylesheet — otherwise the
  // higher-specificity inline values would permanently block the CSS-class-based
  // transitions used by keyboard/button navigation.
  let clearTimer = null;
  function scheduleClearInlineStyle(delay){
    if(clearTimer) clearTimeout(clearTimer);
    clearTimer = setTimeout(()=>{
      if(!dragging){
        card.style.transition = '';
        card.style.transform = '';
        card.style.opacity = '';
      }
      clearTimer = null;
    }, delay);
  }

  function commitDrag(){
    if(!LIBRARY.length){ resetCardStyle(true); return; }
    card.classList.remove('dragging');
    card.style.transition = 'transform .14s linear, opacity .14s linear';

    let exitX=0, exitY=0, nextIdx=currentIndex;
    if(dragAxis === 'x'){
      if(dx < 0){ exitX = -EXIT_X; nextIdx = (currentIndex+1)%LIBRARY.length; }
      else      { exitX =  EXIT_X; nextIdx = (currentIndex-1+LIBRARY.length)%LIBRARY.length; }
    } else if(dragAxis === 'y'){
      if(dy < 0){ exitY = -EXIT_Y; nextIdx = letterTargetIndex(-1); }
      else      { exitY =  EXIT_Y; nextIdx = letterTargetIndex(1); }
    }

    card.style.transform = `translate(${exitX}px, ${exitY}px)`;
    card.style.opacity = '0';

    setTimeout(()=>{
      currentIndex = nextIdx;
      render();
      // enter from the opposite side, then cut straight to center — no ease, no bounce
      card.style.transition = 'none';
      card.style.transform = `translate(${-exitX*0.4}px, ${-exitY*0.4}px)`;
      card.style.opacity = '0';
      void card.offsetWidth; // force reflow so the entrance transition below actually animates
      card.style.transition = 'transform .16s linear, opacity .16s linear';
      resetCardStyle(true);
    }, 140);
  }

  function endDrag(committed){
    if(committed) commitDrag();
    else {
      card.classList.remove('dragging');
      resetCardStyle(true);
    }
    dragging = false;
    dragAxis = null;
  }

  document.body.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('button, input, #letterRail, #wave, #tracklist')) return;
    if(clearTimer){ clearTimeout(clearTimer); clearTimer = null; }
    dragging = true;
    dragAxis = null;
    startX = lastMoveX = e.clientX;
    startY = lastMoveY = e.clientY;
    lastMoveT = performance.now();
    velocity = 0;
    dx = dy = 0;
  });

  document.body.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    dx = e.clientX - startX;
    dy = e.clientY - startY;

    if(!dragAxis){
      if(Math.abs(dx) < DRAG_DEADZONE && Math.abs(dy) < DRAG_DEADZONE) return;
      dragAxis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      card.classList.add('dragging');
    }

    const now = performance.now();
    const dt = Math.max(1, now - lastMoveT);
    const primaryDelta = dragAxis === 'x' ? (e.clientX - lastMoveX) : (e.clientY - lastMoveY);
    velocity = primaryDelta / dt;
    lastMoveX = e.clientX; lastMoveY = e.clientY; lastMoveT = now;

    applyDragTransform();
  });

  function handlePointerEnd(){
    if(!dragging) return;
    if(!dragAxis){ dragging = false; return; } // never moved past deadzone — treat as a tap
    const distance = dragAxis === 'x' ? Math.abs(dx) : Math.abs(dy);
    const committed = distance > COMMIT_DISTANCE || Math.abs(velocity) > COMMIT_VELOCITY;
    endDrag(committed);
  }

  document.body.addEventListener('pointerup', handlePointerEnd);
  document.body.addEventListener('pointercancel', handlePointerEnd);

  window.addEventListener('resize', ()=>{
    resizeWaveCanvas();
    if(currentIndex>=0){
      const track = LIBRARY[currentIndex];
      const dur = audioEl.duration || track.duration || 1;
      drawWave(track.peaks, audioEl.currentTime/dur);
    }
  });

  /* ---------- persistence: a name, and a list of named vaults (folders) ---------- */
  const IDB_NAME = 'looseleaf';
  const IDB_STORE = 'handles';
  const VAULTS_KEY = 'vaultList';
  const NAME_KEY = 'rootName';

  function idbOpen(){
    return new Promise((resolve,reject)=>{
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
  }
  async function idbSet(key, value){
    try{
      const db = await idbOpen();
      return new Promise((resolve,reject)=>{
        const tx = db.transaction(IDB_STORE,'readwrite');
        tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = ()=>resolve(true);
        tx.onerror = ()=>reject(tx.error);
      });
    } catch(e){ return false; }
  }
  async function idbGet(key){
    try{
      const db = await idbOpen();
      return new Promise((resolve,reject)=>{
        const tx = db.transaction(IDB_STORE,'readonly');
        const req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = ()=>resolve(req.result || null);
        req.onerror = ()=>reject(req.error);
      });
    } catch(e){ return null; }
  }

  async function saveVaults(){ return await idbSet(VAULTS_KEY, vaults); }

  /* ---------- walking a real directory of files ---------- */
  const AUDIO_NAME_RE = /\.(mp3|wav|ogg|m4a|flac|aac)$/i;

  async function* walkDirectory(dirHandle){
    for await (const [, handle] of dirHandle.entries()){
      if(handle.kind === 'file'){
        if(AUDIO_NAME_RE.test(handle.name)) yield handle;
      } else if(handle.kind === 'directory'){
        yield* walkDirectory(handle);
      }
    }
  }

  async function collectFilesFromDirectory(dirHandle){
    const files = [];
    for await (const fileHandle of walkDirectory(dirHandle)){
      try{ files.push(await fileHandle.getFile()); } catch(e){ /* skip unreadable file */ }
    }
    return files;
  }

  function revokeTrackUrls(track){
    if(track.url) URL.revokeObjectURL(track.url);
    if(track.artUrl) URL.revokeObjectURL(track.artUrl);
  }

  function clearLibrary(){
    audioEl.pause();
    audioEl.removeAttribute('src');
    LIBRARY.forEach(revokeTrackUrls);
    LIBRARY = [];
    letters = [];
    currentIndex = -1;
    keyFilter = null; playedKeys.clear();
    playHistory.length = 0; lastShown = null; shuffleSeen.clear();
    if('mediaSession' in navigator){ try{ navigator.mediaSession.metadata = null; navigator.mediaSession.playbackState = 'none'; }catch(e){} }
    buildLetterRail();
    stage.classList.add('hidden');
  }

  function setLibraryLabel(name){
    libraryLabel.textContent = name ? `vault: ${name}` : '';
  }

  // Directory screen: the root breadcrumb plus every saved vault. A vault is an
  // in-app playlist-style folder: it is named, saved, and revisited later.
  function showDirectory(){

    currentVault = null;
    setLibraryLabel('');

    vaultEmpty.classList.add('hidden');
    vaultNaming.classList.add('hidden');

    directoryView.classList.remove('hidden');

    dirRoot.textContent = `/ ${localStorage.getItem(NAME_KEY) || 'library'} /`;
    renderVaultList();

  /* ---------- where a vault's songs live ----------
     link : a real folder on this device (Chrome, Edge). Nothing is copied, so nothing can be evicted.
     opfs : copies in the browser's private file storage (Chrome, Edge, Firefox, Safari).
     idb  : copies inside IndexedDB. Older vaults, or browsers with no private file storage. */
  const FSA_OK = typeof window.showDirectoryPicker === 'function';
  let OPFS_OK = false;
  const kindOf = v => v.kind || (v.dirHandle ? 'link' : 'idb');
  const fkOf = f => `${f.name}|${f.size}|${f.lastModified}`;
  const songCount = v => kindOf(v) === 'link' ? (v.count || 0) : (v.songs || v.files || []).length;
  const newVaultId = () => `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  function newVault(name, extra){
    return Object.assign({ id: newVaultId(), name, kind: OPFS_OK ? 'opfs' : 'idb' }, OPFS_OK ? { songs: [] } : { files: [] }, extra || {});
  }
  const fmtBytes = n => n >= 1e9 ? (n/1e9).toFixed(1) + ' GB' : n >= 1e6 ? Math.round(n/1e6) + ' MB' : Math.round(n/1e3) + ' KB';
  const ago = ms => { const d = Math.floor((Date.now() - ms) / 86400000); return d < 1 ? 'today' : d === 1 ? 'yesterday' : `${d} days ago`; };

  const toastEl = document.getElementById('toast'); let toastTimer = 0;
  function busy(msg){ clearTimeout(toastTimer); if(msg){ toastEl.textContent = msg; toastEl.classList.add('on'); } else toastEl.classList.remove('on'); }
  function toast(msg, ms){ busy(msg); toastTimer = setTimeout(()=>toastEl.classList.remove('on'), ms || 5000); }

  async function detectOpfs(){
    try{
      if(!(navigator.storage && navigator.storage.getDirectory)) return false;
      const root = await navigator.storage.getDirectory();
      await root.getDirectoryHandle('looseleaf', { create: true });
      return true;
    } catch(e){ return false; }
  }
  async function opfsVaultDir(vault, create){
    const root = await navigator.storage.getDirectory();
    const top = await root.getDirectoryHandle('looseleaf', { create: true });
    return top.getDirectoryHandle(vault.id, { create: !!create });
  }
  async function opfsDropVault(vault){
    try{ const root = await navigator.storage.getDirectory(); const top = await root.getDirectoryHandle('looseleaf'); await top.removeEntry(vault.id, { recursive: true }); } catch(e){}
  }
  async function opfsDropSong(vault, key){
    try{ const d = await opfsVaultDir(vault, false); await d.removeEntry(key); } catch(e){}
  }

  // Some Safari versions can't stream into a file from the page itself, but every browser
  // with private file storage can write from a worker. Used only when createWritable is missing.
  let opfsWorker = null, workerSeq = 0; const workerJobs = new Map();
  function workerWrite(vid, key, file){
    if(!opfsWorker){
      const body = function(){
        self.onmessage = async e => {
          const m = e.data;
          try{
            const root = await navigator.storage.getDirectory();
            const top = await root.getDirectoryHandle('looseleaf', { create: true });
            const dir = await top.getDirectoryHandle(m.vid, { create: true });
            const fh = await dir.getFileHandle(m.key, { create: true });
            const ah = await fh.createSyncAccessHandle();
            try{
              ah.truncate(0);
              let off = 0; const CH = 4 * 1024 * 1024;
              while(off < m.file.size){
                const buf = new Uint8Array(await m.file.slice(off, off + CH).arrayBuffer());
                ah.write(buf, { at: off }); off += buf.length;
              }
              ah.flush();
            } finally { ah.close(); }
            self.postMessage({ id: m.id, ok: true });
          } catch(err){ self.postMessage({ id: m.id, ok: false, name: err && err.name, msg: String(err && err.message || err) }); }
        };
      };
      opfsWorker = new Worker(URL.createObjectURL(new Blob(['(' + body.toString() + ')()'], { type: 'text/javascript' })));
      opfsWorker.onmessage = e => {
        const d = e.data, j = workerJobs.get(d.id); if(!j) return; workerJobs.delete(d.id);
        if(d.ok) j.res(); else j.rej(Object.assign(new Error(d.msg), { name: d.name || 'Error' }));
      };
      opfsWorker.onerror = () => { workerJobs.forEach(j => j.rej(new Error('worker failed'))); workerJobs.clear(); opfsWorker = null; };
    }
    return new Promise((res, rej)=>{ const id = ++workerSeq; workerJobs.set(id, { res, rej }); opfsWorker.postMessage({ id, vid, key, file }); });
  }
  async function opfsPut(vault, dir, key, file){
    const fh = await dir.getFileHandle(key, { create: true });
    if(typeof fh.createWritable === 'function'){
      const w = await fh.createWritable();
      try{ await w.write(file); await w.close(); }
      catch(e){ try{ await w.abort(); }catch(_){} throw e; }
    } else {
      await workerWrite(vault.id, key, file);
    }
  }
  const newKey = name => Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + ((String(name).match(/\.[a-z0-9]{1,5}$/i) || [''])[0]);

  // Reads a vault's copies back. The File objects are backed by the stored files, not held in memory.
  async function opfsFiles(vault){
    const files = [], missing = [], failed = [];
    let dir = null;
    try{ dir = await opfsVaultDir(vault, false); } catch(e){ if(!(e && e.name === 'NotFoundError')) throw e; }
    for(const rec of (vault.songs || [])){
      if(!dir){ missing.push(rec); continue; }
      try{
        const f = await (await dir.getFileHandle(rec.key)).getFile();
        files.push(new File([f], rec.name, { type: rec.type || f.type, lastModified: rec.lastModified }));
      } catch(e){ (e && e.name === 'NotFoundError' ? missing : failed).push(rec); }
    }
    return { files, missing, failed };
  }

  // Saves newly added songs into the vault. Returns the files that made it in.
  async function persistFiles(v, files){
    const k = kindOf(v);
    if(k === 'link') return [];
    const have = new Set(k === 'opfs' ? (v.songs || []).map(fkOf) : (v.files || []).map(fkOf));
    const fresh = [];
    for(const f of files){ const fk = fkOf(f); if(!have.has(fk)){ have.add(fk); fresh.push(f); } }   // skip songs the vault already has
    if(!fresh.length) return [];
    requestPersist();
    if(k !== 'opfs'){ (v.files = v.files || []).push(...fresh); const ok = await saveVaults(); if(!ok) toast("this browser wouldn't save these songs. they'll be gone when you close the page.", 8000); return fresh; }
    const saved = []; let failed = 0, lastErr = null;
    try{
      const dir = await opfsVaultDir(v, true);
      v.songs = v.songs || [];
      for(let i = 0; i < fresh.length; i++){
        busy(fresh.length > 1 ? `saving ${i + 1} of ${fresh.length}…` : 'saving…');
        const f = fresh[i], key = newKey(f.name);
        try{ await opfsPut(v, dir, key, f); v.songs.push({ key, name: f.name, size: f.size, lastModified: f.lastModified, type: f.type }); saved.push(f); }
        catch(e){ failed++; lastErr = e; try{ await dir.removeEntry(key); }catch(_){} }
      }
    } catch(e){ failed = fresh.length - saved.length; lastErr = e; }
    busy(null);
    if(!saved.length && failed && !(lastErr && lastErr.name === 'QuotaExceededError')){
      // private file storage refused everything (some locked-down browsers). Fall back to the older way.
      v.kind = 'idb'; v.files = (v.files || []).concat(fresh); if(!(v.songs && v.songs.length)) delete v.songs;
      const ok = await saveVaults();
      toast(ok ? 'this browser blocked private file storage, so songs are stored the older way.' : "this browser wouldn't save these songs. they'll be gone when you close the page.", 8000);
      return fresh;
    }
    await saveVaults();
    if(failed) toast(lastErr && lastErr.name === 'QuotaExceededError' ? `storage is full: ${failed} song${failed === 1 ? '' : 's'} weren't saved.` : `${failed} song${failed === 1 ? '' : 's'} couldn't be saved.`, 8000);
    return saved;
  }

  // Older vaults keep their songs inside IndexedDB. Move them over, and only switch once every song made it.
  async function migrateToOpfs(vault){
    const files = vault.files || [];
    if(!files.length || !OPFS_OK) return;
    try{
      const dir = await opfsVaultDir(vault, true);
      const songs = [];
      for(let i = 0; i < files.length; i++){
        busy(`moving songs to safer storage ${i + 1} of ${files.length}…`);
        const f = files[i], key = newKey(f.name);
        await opfsPut(vault, dir, key, f);
        songs.push({ key, name: f.name, size: f.size, lastModified: f.lastModified, type: f.type });
      }
      vault.songs = songs; vault.kind = 'opfs'; delete vault.files;
      await saveVaults();
    } catch(e){
      await opfsDropVault(vault);
      toast("couldn't move this vault to safer storage. it will keep working as before.", 7000);
    }
    busy(null);
  }

  let persisted = false;
  async function requestPersist(){
    try{ if(navigator.storage && navigator.storage.persist) persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist()); } catch(e){}
    return persisted;
  }
  async function storageLine(){
    let line = '';
    try{ const e = await navigator.storage.estimate(); line = `${fmtBytes(e.usage || 0)} used of ${fmtBytes(e.quota || 0)}`; } catch(e){ line = 'storage size unknown'; }
    try{ line += (await navigator.storage.persisted()) ? '\nprotected from clean-up' : '\nnot protected: the browser may clear it'; } catch(e){}
    return line;
  }

  /* ---------- install + gentle warnings ---------- */
  const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const IS_SAFARI = !IS_IOS && /safari/i.test(navigator.userAgent) && !/chrome|chromium|android|crios|fxios|edg/i.test(navigator.userAgent);
  const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const installBtn = document.getElementById('installBtn'), storageTip = document.getElementById('storageTip');
  let deferredInstall = null;
  window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredInstall = e; installBtn.classList.remove('hidden'); });
  window.addEventListener('appinstalled', ()=>{ deferredInstall = null; installBtn.classList.add('hidden'); });
  installBtn.addEventListener('click', async ()=>{
    if(!deferredInstall) return;
    deferredInstall.prompt();
    try{ await deferredInstall.userChoice; }catch(e){}
    deferredInstall = null; installBtn.classList.add('hidden');
  });
  function updateTip(){
    let msg = '';
    if(IS_IOS && !isStandalone()) msg = 'on iPhone and iPad, Safari can clear songs saved in a website after about a week unused. tap Share, then Add to Home Screen, and open looseleaf from there to keep them. you can also back a vault up from its ⋯ menu.';
    else if(IS_SAFARI) msg = 'Safari can clear songs saved in a website after about a week unused. use File, then Add to Dock, or open looseleaf in Chrome or Edge and link a folder so nothing is copied. you can also back a vault up from its ⋯ menu.';
    let dismissed = false; try{ dismissed = !!localStorage.getItem('looseleaf.tip'); }catch(e){}
    storageTip.classList.toggle('hidden', !msg || dismissed);
    storageTip.querySelector('p').textContent = msg;
  }
  document.getElementById('tipClose').addEventListener('click', ()=>{ try{ localStorage.setItem('looseleaf.tip', '1'); }catch(e){} storageTip.classList.add('hidden'); });
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});

  /* ---------- vault directory + opening a vault ---------- */
  function renderVaultList(){
    vaultListEl.innerHTML = '';
    vaults.forEach(vault=>{
      const n = songCount(vault);
      const row = document.createElement('button');
      row.className = 'vaultRow';
      row.innerHTML = '<span class="vaultName"></span><span class="vaultMeta"></span>';
      row.querySelector('.vaultName').textContent = vault.name;
      row.querySelector('.vaultMeta').textContent = `${n} ${n===1 ? 'SONG' : 'SONGS'}` + (kindOf(vault) === 'link' ? ' · LINKED' : '');
      row.addEventListener('click', ()=>openVault(vault));
      vaultListEl.appendChild(row);
    });
  }

  const vaultLinkBtn = document.getElementById('vaultLinkBtn'), vaultRetryBtn = document.getElementById('vaultRetryBtn');
  function showVaultEmpty(msg, o){
    o = o || {};
    document.getElementById('vaultEmptyMsg').textContent = msg ||
      ('this vault has no songs yet. add some and a copy is kept in this browser.' + (FSA_OK ? ' or link a folder on this device and nothing is copied.' : ''));
    vaultAddBtn.classList.toggle('hidden', o.add === false);
    vaultLinkBtn.classList.toggle('hidden', !(FSA_OK && o.link !== false));
    vaultRetryBtn.classList.toggle('hidden', !o.retry);
    vaultEmpty.classList.remove('hidden'); emptyState.classList.remove('hidden');
  }

  // A linked vault re-reads its folder every time it opens, so new files show up on their own.
  async function openLinked(vault, live){
    const h = vault.dirHandle;
    const problem = (msg, o)=>{ if(live()) showVaultEmpty(msg, Object.assign({ add: false, retry: true }, o)); return null; };
    if(!h) return problem('this vault lost its folder link. pick the folder again.', { retry: false });
    try{
      let p = await h.queryPermission({ mode: 'read' });
      if(p !== 'granted') p = await h.requestPermission({ mode: 'read' });   // this tap is the user gesture browsers require
      if(p !== 'granted') return problem('looseleaf needs permission to read that folder. tap try again, then allow.');
      busy('reading folder…');
      const all = await collectFilesFromDirectory(h);
      if(!live()) return null;
      const hidden = new Set(vault.hidden || []);
      const list = all.filter(f => !hidden.has(fkOf(f)));
      vault.count = list.length; saveVaults();
      if(!list.length) return problem(all.length ? 'every song in that folder has been removed from this vault. open ⋯ to show them again.' : 'no songs found in that folder.');
      return list;
    } catch(e){
      return problem(e && e.name === 'NotFoundError' ? "that folder can't be found. it may have been moved or renamed. pick it again." : "couldn't read that folder. tap try again.");
    }
  }

  async function linkFolder(){
    const v = currentVault; if(!v || !FSA_OK) return;
    let h;
    try{ h = await window.showDirectoryPicker({ id: 'looseleaf', mode: 'read' }); }
    catch(e){ if(e && e.name === 'AbortError') return; toast("this browser wouldn't open the folder picker.", 6000); return; }
    if(kindOf(v) === 'opfs') opfsDropVault(v);   // only reachable while the vault has no songs of its own
    v.kind = 'link'; v.dirHandle = h; v.hidden = []; v.count = 0; delete v.songs; delete v.files;
    const ok = await saveVaults();
    if(!ok) toast("this browser can't remember the folder, so you'll need to pick it again next time.", 8000);
    openVault(v);
  }

  let openToken = 0;
  async function openVault(vault){
    const token = ++openToken;
    const live = () => token === openToken && currentVault === vault;
    clearLibrary();
    currentVault = vault;
    setLibraryLabel(vault.name);
    menuBtn.classList.remove('hidden');
    directoryView.classList.add('hidden');
    vaultEmpty.classList.add('hidden');
    let k = kindOf(vault), files = [], lostMsg = '';
    addBtn.classList.toggle('hidden', k === 'link');
    try{
      if(k === 'link'){
        const r = await openLinked(vault, live);
        if(!live() || !r) return;
        files = r;
      } else {
        if(k === 'idb' && OPFS_OK && (vault.files || []).length){ await migrateToOpfs(vault); k = kindOf(vault); }
        if(!live()) return;
        if(k === 'opfs'){
          if((vault.songs || []).length) busy('opening…');
          const r = await opfsFiles(vault);
          if(!live()) return;
          files = r.files;
          if(r.failed.length) lostMsg = `${r.failed.length} song${r.failed.length === 1 ? '' : 's'} couldn't be read just now. try opening the vault again.`;
          if(r.missing.length){
            vault.songs = vault.songs.filter(x => !r.missing.includes(x)); await saveVaults();
            lostMsg = `${r.missing.length} song${r.missing.length === 1 ? ' is' : 's are'} gone from this browser's storage (browsers can clear it). add ${r.missing.length === 1 ? 'it' : 'them'} again and your order and BPM/key fixes come back.`;
          }
        } else files = vault.files || [];
      }
    } catch(e){
      if(live()){ busy(null); showVaultEmpty("couldn't open this vault. tap try again.", { add: k !== 'link', retry: true }); }
      return;
    } finally { if(token === openToken) busy(null); }
    if(!files.length){ showVaultEmpty(lostMsg || undefined, { add: true }); return; }
    emptyState.classList.add('hidden');
    await addFiles(files, false);
    if(lostMsg) toast(lostMsg, 9000);
  }

  // Directory screen: the root breadcrumb plus every saved vault.

  async function confirmVaultName(){
    const name = vaultNameInput.value.trim() || 'untitled vault';
    const vault = newVault(name);
    vaults.push(vault);
    const saved = await saveVaults();
    requestPersist();
    openVault(vault);
    if(!saved) setLibraryLabel(name + ' (not saved: browser storage blocked)');
  }

  /* ---------- loading files ---------- */
  function bpmToDisplay(raw){
    const n = parseFloat(raw);
    return isFinite(n) && n>0 ? String(Math.round(n)) : raw.trim();
  }

  async function addFiles(fileList, persist=true){
    let audioFiles = [...fileList].filter(f => f.type.startsWith('audio/') || AUDIO_NAME_RE.test(f.name));
    if(!audioFiles.length) return;
    if(persist && currentVault){
      const v = currentVault;
      audioFiles = await persistFiles(v, audioFiles);
      if(currentVault !== v || !audioFiles.length) return;
    }

    const wasEmpty = LIBRARY.length === 0;
    const previousTrack = currentIndex >= 0 ? LIBRARY[currentIndex] : null;

    const newTracks = audioFiles.map(file=>({
      id: Date.now() + Math.random(),
      title: titleFromFilename(file.name),
      artist: '',
      key: '—',
      bpm: '—',
      file: file,
      url: URL.createObjectURL(file),
      peaks: null,
      duration: 0,
      artUrl: null,
      artImageEl: null,
      _fk: fkOf(file),
    }));
    LIBRARY.push(...newTracks);

    // Read each file's real tags/art before sorting & rendering, so the
    // letter rail and title only update once, with accurate info in hand
    // (these are small header reads, not full audio decodes — fast).
    await Promise.all(newTracks.map(async track=>{
      try{
        const { art, tags } = await extractMetadata(track.file);
        if(tags.title) track.title = tags.title;
        if(tags.artist) track.artist = tags.artist;
        if(tags.bpm) track.bpm = bpmToDisplay(tags.bpm);
        if(tags.key) track.key = tags.key;
        if(art) track.artUrl = URL.createObjectURL(new Blob([art.data], { type: art.mime }));
      } catch(e){ /* no readable tags — filename title + procedural art already in place */ }
      const c = currentVault && currentVault.meta && currentVault.meta[track._fk];   // saved values from last time
      if(c){
        if(c.bpm && c.bpm !== '—' && (c.bpmManual || track.bpm === '—')){ track.bpm = c.bpm; track.bpmGuess = c.bpmGuess; track.bpmLow = c.bpmLow; track.bpmManual = c.bpmManual; }
        if(c.key && c.key !== '—' && (c.keyManual || track.key === '—')){ track.key = c.key; track.keyGuess = c.keyGuess; track.keyManual = c.keyManual; }
        if(Array.isArray(c.cues)) track.cues = c.cues.slice(0, 4);
        if(c.loop && c.loop.a != null) track.loop = c.loop;
        if(c.grid != null) track.grid = c.grid;
      }
    }));

    rebuildLettersAndSort();

    if(wasEmpty){
      emptyState.classList.add('hidden');
      stage.classList.remove('hidden');
      currentIndex = 0;
      render();
    } else if(previousTrack){
      // the list just got re-sorted alphabetically — make sure we're still
      // pointing at the same track that was actually playing, not whatever
      // now sits at the old numeric index.
      const newIndex = LIBRARY.indexOf(previousTrack);
      if(newIndex >= 0) currentIndex = newIndex;
      refreshChrome();
    }
    analyzeAll();
  }

  const fileInput = document.getElementById('fileInput');
  document.getElementById('addBtn').addEventListener('click', ()=>fileInput.click());
  vaultAddBtn.addEventListener('click', ()=>fileInput.click());
  vaultLinkBtn.addEventListener('click', linkFolder);
  vaultRetryBtn.addEventListener('click', ()=>{ if(currentVault) openVault(currentVault); });
  document.getElementById('folderBtn').addEventListener('click', showDirectory);
  createVaultBtn.addEventListener('click', createVault);
  vaultNameConfirmBtn.addEventListener('click', confirmVaultName);
  vaultNameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') confirmVaultName(); });
  fileInput.addEventListener('change', (e)=>{ addFiles(e.target.files); fileInput.value=''; });

  function saveName(){
    const name = nameInput.value.trim();
    if(!name) return;
    localStorage.setItem(NAME_KEY, name);
    nameGate.classList.add('hidden');
    showDirectory();
  }
  nameContinueBtn.addEventListener('click', saveName);
  nameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') saveName(); });

  let dragDepth = 0;
  window.addEventListener('dragenter', (e)=>{ e.preventDefault(); if(!currentVault || kindOf(currentVault) === 'link') return; dragDepth++; dropOverlay.classList.add('active'); });
  window.addEventListener('dragleave', ()=>{ dragDepth--; if(dragDepth<=0){ dragDepth=0; dropOverlay.classList.remove('active'); } });
  window.addEventListener('dragover', (e)=>e.preventDefault());
  window.addEventListener('drop', (e)=>{
    e.preventDefault();
    dragDepth = 0;
    dropOverlay.classList.remove('active');
    if(currentVault && kindOf(currentVault) !== 'link' && e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
  });

  /* ---------- init ---------- */
  buildLetterRail();

  // Fallback for browsers without `dvh` support (iOS Safari < 15.4): measure the
  // real visible viewport height in JS so the layout doesn't get clipped behind
  // the address bar. Modern browsers already get this for free via `dvh` in CSS;
  // this just backstops the older ones.
  function setAppHeight(){
    document.documentElement.style.setProperty('--app-vh', `${window.innerHeight * 0.01}px`);
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', setAppHeight);

  (async function init(){
    setShuffle(recall('shuffle') === '1', false); setRepeat(recall('repeat') || 'off', false);
    setAdvanced(recall('advanced') === '1', false);
    { const v = parseFloat(recall('vol')); setVolume(isFinite(v) ? v : 1, false); if(volLevel > 0) lastVol = volLevel; }
    OPFS_OK = await detectOpfs();
    vaults = (await idbGet(VAULTS_KEY)) || [];
    try{ if(navigator.storage && navigator.storage.persisted) persisted = await navigator.storage.persisted(); }catch(e){}
    const savedName = localStorage.getItem(NAME_KEY);
    if(savedName){
      nameGate.classList.add('hidden');
      showDirectory();
    }
    // else: nameGate is visible by default in the markup — nothing to do.
  })();

})();
</script>
</body>
</html>
